<svg width="100%" height="100%" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" fill="none">
  <style>
    .circle-rotate-1 {
      animation: rotate1 8s linear infinite;
      transform-origin: 400px 300px;
    }
    .circle-rotate-2 {
      animation: rotate2 12s linear infinite;
      transform-origin: 400px 300px;
    }
    
    @keyframes rotate1 {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    @keyframes rotate2 {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
  </style>
  
  <circle class="circle-rotate-1" cx="400" cy="300" r="120" stroke="#FFD700" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  <g class="circle-rotate-2" style="transform-origin: 400px 300px;">
    <path d="M 480 300 A 80 80 0 0 1 400 380" stroke="#FFD700" stroke-width="2" fill="none"/>
    <path d="M 400 380 A 80 80 0 0 1 320 300" stroke="#FFD700" stroke-width="2" fill="none"/>
    <path d="M 320 300 A 80 80 0 0 1 400 220" stroke="#FFD700" stroke-width="2" fill="none"/>
  </g>
</svg>
